<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>🍰 Kawaii Cake Tower 🍰</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffeef2;
      font-family: 'Comic Sans MS', 'Quicksand', 'Nunito', cursive, sans-serif;
    }
    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(180deg, #bbf2f6 0%, #ffeaa7 55%, #fab1a0 100%);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    /* UI Overlays */
    .screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(255, 245, 248, 0.88);
      backdrop-filter: blur(8px);
      z-index: 10;
      text-align: center;
      padding: 24px;
      transition: opacity 0.25s ease;
    }
    .hidden {
      display: none !important;
    }
    h1 {
      font-size: 2.2rem;
      color: #ff6b81;
      text-shadow: 2px 2px 0px #fff, 0 0 16px rgba(255, 107, 129, 0.4);
      margin-bottom: 6px;
    }
    p {
      color: #747d8c;
      font-size: 1rem;
      margin-bottom: 18px;
    }
    .btn {
      background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
      color: white;
      border: none;
      border-radius: 50px;
      padding: 15px 40px;
      font-size: 1.25rem;
      font-weight: bold;
      box-shadow: 0 6px 18px rgba(255, 117, 140, 0.45);
      cursor: pointer;
      outline: none;
      transition: transform 0.1s;
    }
    .btn:active {
      transform: scale(0.94);
    }
    /* HUD */
    #hud {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: env(safe-area-inset-top, 20px) 16px 0 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 5;
      pointer-events: none;
    }
    .score-badge {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(4px);
      border-radius: 20px;
      padding: 6px 16px;
      font-size: 1.2rem;
      font-weight: bold;
      color: #ff4757;
      box-shadow: 0 3px 8px rgba(0,0,0,0.06);
    }
    #combo-indicator {
      position: absolute;
      top: 25%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      font-size: 1.8rem;
      font-weight: bold;
      color: #ff4757;
      text-shadow: 2px 2px 0 #fff;
      pointer-events: none;
      z-index: 6;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    #combo-indicator.pop {
      transform: translate(-50%, -50%) scale(1.15);
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- Top Score Info -->
    <div id="hud">
      <div class="score-badge" id="hud-score">🍰 Level: 0</div>
      <div class="score-badge" id="hud-best">👑 Best: 0</div>
    </div>

    <div id="combo-indicator">PERFECT! ✨</div>

    <!-- Start Screen -->
    <div id="start-screen" class="screen">
      <h1>🍰 Sweet Cake Bakery 🍰</h1>
      <p>Help Chef Kitty stack the dream cake!<br>Tap screen anywhere to place a layer 🍓</p>
      <div style="font-size: 3.5rem; margin-bottom: 20px;">🐱🎂✨</div>
      <button class="btn" onclick="startGame()">START BAKING 🌸</button>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over-screen" class="screen hidden">
      <h1 style="color:#ff4757;">Cake Tipped Over! 🧁</h1>
      <p id="over-summary">You built a 0 layer cake!</p>
      <div id="kitty-evaluation" style="font-size: 1.1rem; color: #ff6b81; font-weight: bold; margin-bottom: 18px;"></div>
      <button class="btn" onclick="restartGame()">BAKE AGAIN 💕</button>
    </div>
  </div>

  <script>
    /* ============================================================
       AUDIO SYNTHESIZER (Cute Music Box Scale using Web Audio API)
       ============================================================ */
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // Pentatonic scale frequencies for sweet harmonious stacking
    const NOTE_SCALE = [
      261.63, 293.66, 329.63, 392.00, 440.00, 
      523.25, 587.33, 659.25, 783.99, 880.00, 1046.50
    ];

    function playTone(freq, duration = 0.2, type = 'triangle', vol = 0.25) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function soundPlace(combo) {
      initAudio();
      const note = NOTE_SCALE[combo % NOTE_SCALE.length];
      playTone(note, 0.35, 'triangle', 0.25);
    }

    function soundPerfect(combo) {
      initAudio();
      const note = NOTE_SCALE[combo % NOTE_SCALE.length];
      playTone(note, 0.4, 'sine', 0.3);
      setTimeout(() => playTone(note * 1.5, 0.3, 'sine', 0.2), 60);
      if (navigator.vibrate) navigator.vibrate(30);
    }

    function soundGameOver() {
      initAudio();
      [320, 290, 240, 190].forEach((f, i) => {
        setTimeout(() => playTone(f, 0.3, 'sawtooth', 0.2), i * 90);
      });
      if (navigator.vibrate) navigator.vibrate(100);
    }

    /* ============================================================
       CANVAS & GAME SETUP
       ============================================================ */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let width = 0;
    let height = 0;

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Pastels for cake layers
    const CAKE_PALETTES = [
      { cake: '#ff9ebb', cream: '#ffffff', detail: '🍓' }, // Strawberry shortcake
      { cake: '#ffd384', cream: '#fff9e6', detail: '🍋' }, // Lemon chiffon
      { cake: '#a8e6cf', cream: '#ffffff', detail: '🍃' }, // Mint matcha
      { cake: '#dcedc1', cream: '#fff3e0', detail: '🍈' }, // Sweet melon
      { cake: '#ffd3b6', cream: '#ffffff', detail: '🍑' }, // Peach dream
      { cake: '#b39ddb', cream: '#ffffff', detail: '🫐' }, // Lavender blueberry
      { cake: '#81ecec', cream: '#e0f7fa', detail: '⭐' }  // Star candy
    ];

    let state = 'START';
    let score = 0;
    let highScore = localStorage.getItem('kawaii_cake_best') || 0;
    let combo = 0;

    // Tower & Camera
    const LAYER_HEIGHT = 44;
    let layers = [];
    let debris = [];
    let particles = [];
    let cameraY = 0;
    let targetCameraY = 0;

    // Active moving cake piece
    let activeLayer = null;

    function createParticle(x, y, color = '#ff7675') {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 4 + 2;
      particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 1,
        color: color,
        size: Math.random() * 5 + 3,
        alpha: 1,
        decay: Math.random() * 0.02 + 0.02
      });
    }

    function triggerComboUI(text) {
      const el = document.getElementById('combo-indicator');
      el.innerText = text;
      el.classList.add('pop');
      setTimeout(() => el.classList.remove('pop'), 650);
    }

    function initGame() {
      score = 0;
      combo = 0;
      cameraY = 0;
      targetCameraY = 0;
      layers = [];
      debris = [];
      particles = [];

      // Base Cake plate
      const baseWidth = Math.min(width * 0.65, 230);
      const baseY = height - 120;
      layers.push({
        x: (width - baseWidth) / 2,
        y: baseY,
        width: baseWidth,
        height: LAYER_HEIGHT,
        palette: CAKE_PALETTES[0]
      });

      spawnNextLayer();
      updateHUD();
    }

    function spawnNextLayer() {
      const prev = layers[layers.length - 1];
      const palette = CAKE_PALETTES[layers.length % CAKE_PALETTES.length];
      const speed = Math.min(3.5 + layers.length * 0.1, 7.5);
      const direction = (layers.length % 2 === 0) ? 1 : -1;

      activeLayer = {
        x: direction === 1 ? -prev.width : width,
        y: prev.y - LAYER_HEIGHT,
        width: prev.width,
        height: LAYER_HEIGHT,
        direction: direction,
        speed: speed,
        palette: palette
      };
    }

    function dropLayer() {
      if (state !== 'PLAYING' || !activeLayer) return;

      const prev = layers[layers.length - 1];
      const diff = activeLayer.x - prev.x;
      const tolerance = 5; // Snapping grace zone for PERFECT

      if (Math.abs(diff) <= tolerance) {
        // === PERFECT STACK ===
        activeLayer.x = prev.x;
        combo++;
        score++;
        soundPerfect(combo);
        triggerComboUI(combo > 1 ? `✨ PERFECT x${combo} ✨` : 'PERFECT! 💖');

        // Confetti explosion
        for (let i = 0; i < 18; i++) {
          createParticle(activeLayer.x + activeLayer.width / 2, activeLayer.y + 10, activeLayer.palette.cake);
        }
      } else if (Math.abs(diff) >= prev.width) {
        // === COMPLETELY MISSED: GAME OVER ===
        debris.push({
          x: activeLayer.x,
          y: activeLayer.y,
          width: activeLayer.width,
          height: activeLayer.height,
          vy: 1,
          vr: 0.08,
          rot: 0,
          palette: activeLayer.palette
        });
        activeLayer = null;
        gameOver();
        return;
      } else {
        // === CUT OVERHANG ===
        combo = 0;
        score++;
        soundPlace(score);

        let newWidth = prev.width - Math.abs(diff);
        let debrisX = 0;
        let debrisW = Math.abs(diff);

        if (diff > 0) {
          // Overhang on the right
          debrisX = prev.x + newWidth;
          activeLayer.width = newWidth;
        } else {
          // Overhang on the left
          debrisX = activeLayer.x;
          activeLayer.x = prev.x;
          activeLayer.width = newWidth;
        }

        // Add chopped off slice to falling debris
        debris.push({
          x: debrisX,
          y: activeLayer.y,
          width: debrisW,
          height: activeLayer.height,
          vy: 2,
          vr: diff > 0 ? 0.05 : -0.05,
          rot: 0,
          palette: activeLayer.palette
        });
      }

      layers.push(activeLayer);

      // Smooth camera follows the top of the cake
      if (layers.length > 5) {
        targetCameraY = (layers.length - 5) * LAYER_HEIGHT;
      }

      updateHUD();
      spawnNextLayer();
    }

    function updateHUD() {
      document.getElementById('hud-score').innerText = `🍰 Level: ${score}`;
      document.getElementById('hud-best').innerText = `👑 Best: ${highScore}`;
    }

    function gameOver() {
      state = 'GAMEOVER';
      soundGameOver();
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('kawaii_cake_best', highScore);
      }

      let evalMsg = "A sweet lovely attempt! 🌸";
      if (score >= 20) evalMsg = "Master Pastry Chef Princess! 👑🎂✨";
      else if (score >= 10) evalMsg = "Super Kawaii Baker! 💖🍰";

      document.getElementById('over-summary').innerText = `You baked a magnificent ${score} layer cake!`;
      document.getElementById('kitty-evaluation').innerText = evalMsg;
      document.getElementById('game-over-screen').classList.remove('hidden');
    }

    function startGame() {
      initAudio();
      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('game-over-screen').classList.add('hidden');
      initGame();
      state = 'PLAYING';
    }

    function restartGame() {
      startGame();
    }

    // Single-tap handler for entire mobile screen
    window.addEventListener('pointerdown', (e) => {
      // Don't trigger if tapping on buttons
      if (e.target.tagName === 'BUTTON') return;
      if (state === 'PLAYING') {
        dropLayer();
      }
    });

    /* ============================================================
       CHEF KITTY & CAKE RENDERING
       ============================================================ */
    function drawChefKitty(x, y) {
      ctx.save();
      ctx.translate(x, y);

      const earBounce = Math.sin(Date.now() * 0.005) * 3;

      // Body / Apron
      ctx.fillStyle = '#ff80ab';
      ctx.beginPath();
      ctx.roundRect(-22, -10, 44, 40, [14, 14, 8, 8]);
      ctx.fill();

      // White Apron Front
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.roundRect(-14, -2, 28, 28, 6);
      ctx.fill();

      // Kitty Head
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(0, -32, 26, 0, Math.PI * 2);
      ctx.fill();

      // Ears
      ctx.fillStyle = '#ffffff';
      // Left Ear
      ctx.beginPath();
      ctx.moveTo(-22, -45);
      ctx.lineTo(-12, -62 + earBounce);
      ctx.lineTo(-2, -48);
      ctx.closePath();
      ctx.fill();
      // Right Ear
      ctx.beginPath();
      ctx.moveTo(2, -48);
      ctx.lineTo(12, -62 + earBounce);
      ctx.lineTo(22, -45);
      ctx.closePath();
      ctx.fill();

      // Pink Inner Ears
      ctx.fillStyle = '#ffb6c1';
      ctx.beginPath();
      ctx.moveTo(-18, -46);
      ctx.lineTo(-12, -56 + earBounce);
      ctx.lineTo(-5, -48);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(5, -48);
      ctx.lineTo(12, -56 + earBounce);
      ctx.lineTo(18, -46);
      ctx.closePath();
      ctx.fill();

      // Cheerful Eyes (Happy Arcs)
      ctx.strokeStyle = '#333333';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(-10, -32, 5, Math.PI * 1.1, Math.PI * 1.9);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(10, -32, 5, Math.PI * 1.1, Math.PI * 1.9);
      ctx.stroke();

      // Cute Pink Nose & Mouth
      ctx.fillStyle = '#ff6b81';
      ctx.beginPath();
      ctx.arc(0, -26, 2.5, 0, Math.PI * 2);
      ctx.fill();

      // Blushing Cheeks
      ctx.fillStyle = '#ff80ab88';
      ctx.beginPath();
      ctx.arc(-14, -24, 4.5, 0, Math.PI * 2);
      ctx.arc(14, -24, 4.5, 0, Math.PI * 2);
      ctx.fill();

      // Chef Toque (Hat)
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(0, -60, 16, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillRect(-12, -52, 24, 8);

      // Hat Ribbon
      ctx.fillStyle = '#ff4757';
      ctx.fillRect(-12, -48, 24, 3);

      ctx.restore();
    }

    function drawCakeSlice(b) {
      ctx.save();
      // Cake base body
      ctx.fillStyle = b.palette.cake;
      ctx.beginPath();
      ctx.roundRect(b.x, b.y, b.width, b.height, [8, 8, 4, 4]);
      ctx.fill();

      // Cream dripping top layer
      ctx.fillStyle = b.palette.cream;
      ctx.beginPath();
      ctx.roundRect(b.x, b.y, b.width, 10, [6, 6, 0, 0]);
      ctx.fill();

      // Sweet cream droplets
      const dropCount = Math.max(2, Math.floor(b.width / 24));
      const step = b.width / dropCount;
      ctx.fillStyle = b.palette.cream;
      for (let i = 0; i < dropCount; i++) {
        ctx.beginPath();
        ctx.arc(b.x + i * step + step / 2, b.y + 10, 4, 0, Math.PI);
        ctx.fill();
      }

      // Layer detail emoji in the center (strawberries, lemons, etc.)
      if (b.width > 35) {
        ctx.font = '16px "Segoe UI Emoji", "Apple Color Emoji"';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(b.palette.detail, b.x + b.width / 2, b.y + b.height / 2 + 4);
      }
      ctx.restore();
    }

    /* ============================================================
       MAIN GAME LOOP
       ============================================================ */
    function gameLoop() {
      ctx.clearRect(0, 0, width, height);

      // Smooth camera interpolation
      cameraY += (targetCameraY - cameraY) * 0.08;

      ctx.save();
      ctx.translate(0, cameraY);

      // Draw Chef Kitty cheering near the base
      drawChefKitty(60, height - 85);

      // Draw all stacked cake layers
      layers.forEach(layer => drawCakeSlice(layer));

      // Draw falling sliced debris
      for (let i = debris.length - 1; i >= 0; i--) {
        const d = debris[i];
        d.y += d.vy;
        d.vy += 0.35; // gravity
        d.rot += d.vr;

        ctx.save();
        ctx.translate(d.x + d.width / 2, d.y + d.height / 2);
        ctx.rotate(d.rot);
        drawCakeSlice({ x: -d.width / 2, y: -d.height / 2, width: d.width, height: d.height, palette: d.palette });
        ctx.restore();

        // Cleanup fallen debris
        if (d.y > height + cameraY + 100) {
          debris.splice(i, 1);
        }
      }

      // Update & Draw active moving layer
      if (state === 'PLAYING' && activeLayer) {
        activeLayer.x += activeLayer.speed * activeLayer.direction;

        // Bounce back and forth
        if (activeLayer.direction === 1 && activeLayer.x + activeLayer.width > width + 40) {
          activeLayer.direction = -1;
        } else if (activeLayer.direction === -1 && activeLayer.x < -40) {
          activeLayer.direction = 1;
        }

        drawCakeSlice(activeLayer);
      }

      // Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= p.decay;

        if (p.alpha <= 0) {
          particles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      ctx.restore();

      requestAnimationFrame(gameLoop);
    }

    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
